<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, initial-scale=0.5">
    <title>Login</title>
    <link href="css/font.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/login.css" rel="stylesheet" />
</head>

<body>
    <!-- 배경 이미지-->
    <div class="backgroundImg">
        <img src="img/background.avif">
    </div>

    <!--로그인폼-->
    <span class="login-text">당신의 기억을 소유하세요</span>
    <form class="login-form">
        <div class="login-input">
            <input id="userID" type="text" minlength="4" maxlength="11" placeholder=" UserID" required />
            <input id="userPW" type="password" minlength="4" maxlength="8" placeholder="UserPW" required />
            <button id="login_btn" type="submit">Login</button>
        </div>
    </form>

    <script src="js/login.js"></script>
</body>

</html>
